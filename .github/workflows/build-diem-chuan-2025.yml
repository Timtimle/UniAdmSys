name: Build diem chuan 2025

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/build_diem_chuan_2025.py"
      - ".github/workflows/build-diem-chuan-2025.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build CSV
        run: python scripts/build_diem_chuan_2025.py
      - name: Commit generated CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/diem_chuan_2025_supabase.csv
          git diff --cached --quiet && exit 0
          git commit -m "Generate diem chuan 2025 dataset"
          git push
