name: Split ERD for README

permissions:
  contents: write

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/crop-erd.yml"

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Pillow
        run: pip install pillow

      - name: Split ERD
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path

          src = Path("docs/assets/database/UniAdmSys_ERD.png")
          img = Image.open(src).convert("RGB")

          out = Path("docs/assets/database/parts")
          out.mkdir(parents=True, exist_ok=True)

          crops = [
              (2050, 0, 2950, 1300),
              (2850, 0, 3750, 1300),
              (2050, 1150, 2950, 2450),
              (2850, 1150, 3750, 2450),
              (2050, 2300, 2950, 3600),
              (2850, 2300, 3750, 3600),
              (2050, 3450, 2950, 4750),
              (2850, 3450, 3750, 4750),
              (2050, 4600, 2950, 5923),
              (2850, 4600, 3750, 5923),
          ]

          for i, box in enumerate(crops, 1):
              img.crop(box).save(out / f"erd_{i:02d}.png", optimize=True)

          p = Path("README.md")
          s = p.read_text(encoding="utf-8")
          marker = "## Database ERD"
          prefix = s.split(marker, 1)[0].rstrip() if marker in s else s.rstrip()

          imgs = "\n\n".join(
              f'<p align="center"><img src="docs/assets/database/parts/erd_{i:02d}.png" alt="Database ERD {i}"></p>'
              for i in range(1, 11)
          )

          p.write_text(
              prefix + "\n\n## Database ERD\n\n" + imgs + "\n",
              encoding="utf-8"
          )
          PY

      - name: Commit ERD parts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md && git add -f docs/assets/database/parts/*.png
          git diff --cached --quiet || git commit -m "docs: make database ERD readable"
          git push
