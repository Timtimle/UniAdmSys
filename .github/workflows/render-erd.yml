name: Render database ERD

permissions:
  contents: write

on:
  push:
    branches:
      - main
    paths:
      - docs/database/schema.sql
      - scripts/render-erd.mjs
      - .github/workflows/render-erd.yml
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Prepare drawDB SQL
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          sql=Path("docs/database/schema.sql").read_text(encoding="utf-8")
          pat=re.compile(r"CREATE TABLE public\.(\w+)\s*\((.*?)\n\);",re.S)
          blocks=[]; fks=[]
          for m in pat.finditer(sql):
              name,body=m.group(1),m.group(2); kept=[]
              for ln in body.splitlines():
                  s=ln.strip().rstrip(",")
                  fm=re.match(r"CONSTRAINT\s+(\w+)\s+FOREIGN KEY\s*\(([^)]+)\)\s+REFERENCES\s+public\.(\w+)\(([^)]+)\)(.*)",s,re.I)
                  if fm:
                      cname,cols,rt,rcols,tail=fm.groups()
                      fks.append(f"ALTER TABLE public.{name} ADD CONSTRAINT {cname} FOREIGN KEY ({cols}) REFERENCES public.{rt}({rcols}){tail};")
                  else: kept.append(ln)
              for i in range(len(kept)-1,-1,-1):
                  if kept[i].strip():
                      kept[i]=kept[i].rstrip().rstrip(","); break
              blocks.append(f"CREATE TABLE public.{name} (\n"+"\n".join(kept)+"\n);")
          out="\n".join(blocks)+"\n\n"+"\n".join(fks)+"\n"
          cleaned=[]
          for ln in out.splitlines():
              comma=ln.rstrip().endswith(",")
              ln=ln.replace("GENERATED ALWAYS AS IDENTITY ","").replace("GENERATED BY DEFAULT AS IDENTITY ","").replace("USER-DEFINED","TEXT")
              if " DEFAULT " in ln:
                  ln=ln.split(" DEFAULT ",1)[0].rstrip() + ("," if comma else "")
              if " CHECK " in ln:
                  ln=ln.split(" CHECK ",1)[0].rstrip().rstrip(",") + ("," if comma else "")
              cleaned.append(ln)
          Path("schema_drawdb.sql").write_text("\n".join(cleaned)+"\n",encoding="utf-8")
          assert len(blocks)==27
          assert len(fks)==48
          PY

      - name: Checkout drawDB
        uses: actions/checkout@v4
        with:
          repository: drawdb-io/drawdb
          ref: ee550b4117a6e1b5366205faa5cee713ee1d4e3b
          path: drawdb

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        working-directory: drawdb
        run: |
          npm ci
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Start drawDB
        working-directory: drawdb
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/drawdb.log 2>&1 &
          for i in {1..90}; do
            curl -fsS http://127.0.0.1:5173 >/dev/null && exit 0
            sleep 1
          done
          exit 1

      - name: Render
        run: |
          cp schema_drawdb.sql drawdb/schema_drawdb.sql
          cp scripts/render-erd.mjs drawdb/render.mjs
          cd drawdb
          node render.mjs

      - name: Commit ERD
        run: |
          mkdir -p docs/assets/database
          cp drawdb/render_out/uniadmsys_drawdb_canvas.png docs/assets/database/UniAdmSys_ERD.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/database/UniAdmSys_ERD.png
          git diff --cached --quiet || git commit -m "docs: render database ERD"
          git push
