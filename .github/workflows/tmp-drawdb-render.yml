name: Temporary drawDB render

permissions:
  contents: write

on:
  push:
    branches: [tmp-drawdb-render-20261004]
    paths:
      - "tmp_drawdb/**"
      - ".github/workflows/tmp-drawdb-render.yml"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Normalize SQL only for parser ordering
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path("tmp_drawdb/schema.sql")
          sql=p.read_text(encoding="utf-8")
          pat=re.compile(r"CREATE TABLE public\.(\w+)\s*\((.*?)\n\);",re.S)
          blocks=[]; fks=[]
          for m in pat.finditer(sql):
              name, body=m.group(1),m.group(2)
              kept=[]
              for ln in body.splitlines():
                  s=ln.strip().rstrip(",")
                  fm=re.match(r"CONSTRAINT\s+(\w+)\s+FOREIGN KEY\s*\(([^)]+)\)\s+REFERENCES\s+public\.(\w+)\(([^)]+)\)(.*)",s,re.I)
                  if fm:
                      cname,cols,rt,rcols,tail=fm.groups()
                      fks.append(f"ALTER TABLE public.{name} ADD CONSTRAINT {cname} FOREIGN KEY ({cols}) REFERENCES public.{rt}({rcols}){tail};")
                  else:
                      kept.append(ln)
              for i in range(len(kept)-1,-1,-1):
                  if kept[i].strip():
                      kept[i]=kept[i].rstrip().rstrip(",")
                      break
              blocks.append(f"CREATE TABLE public.{name} (\n"+"\n".join(kept)+"\n);")
          out="\n".join(blocks)+"\n\n"+"\n".join(fks)+"\n"
          # drawDB/node-sql-parser compatibility view: keep ERD structure,
          # keys and nullability; omit defaults/check expressions that do not
          # affect table relationships. USER-DEFINED in the dump is only a
          # placeholder, so render it as TEXT rather than inventing an extension.
          cleaned=[]
          for ln in out.splitlines():
              had_comma=ln.rstrip().endswith(",")
              ln=ln.replace("GENERATED ALWAYS AS IDENTITY ","")
              ln=ln.replace("GENERATED BY DEFAULT AS IDENTITY ","")
              ln=ln.replace("USER-DEFINED","TEXT")
              if " DEFAULT " in ln:
                  ln=ln.split(" DEFAULT ",1)[0].rstrip()
                  if had_comma: ln += ","
              if " CHECK " in ln:
                  ln=ln.split(" CHECK ",1)[0].rstrip().rstrip(",")
                  if had_comma: ln += ","
              cleaned.append(ln)
          out="\n".join(cleaned)+"\n"
          Path("schema_drawdb.sql").write_text(out,encoding="utf-8")
          print("tables",len(blocks),"fks",len(fks))
          assert len(blocks)==27
          assert len(fks)==48
          PY

      - name: Checkout drawDB itself
        uses: actions/checkout@v4
        with:
          repository: drawdb-io/drawdb
          ref: ee550b4117a6e1b5366205faa5cee713ee1d4e3b
          path: drawdb

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install drawDB and browser automation
        working-directory: drawdb
        run: |
          npm ci
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Start drawDB
        working-directory: drawdb
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/drawdb.log 2>&1 &
          for i in {1..90}; do
            curl -fsS http://127.0.0.1:5173 >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/drawdb.log
          exit 1

      - name: Let drawDB import, auto-arrange and render
        run: |
          cp schema_drawdb.sql drawdb/schema_drawdb.sql
          cp tmp_drawdb/render.mjs drawdb/render.mjs
          cd drawdb
          node render.mjs

      - name: Publish large ERD to main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --branch main https://x-access-token:${GH_TOKEN}@github.com/Timtimle/UniAdmSys.git publish_repo
          mkdir -p publish_repo/docs/assets/database
          cp drawdb/render_out/uniadmsys_drawdb_canvas.png publish_repo/docs/assets/database/UniAdmSys_ERD.png
          rm -f publish_repo/docs/database/ERD.md
          python - <<'PY'
          from pathlib import Path
          p=Path("publish_repo/README.md")
          s=p.read_text(encoding="utf-8")
          marker="## Database ERD"
          if marker in s:
              s=s.split(marker,1)[0].rstrip()
          block='''

## Database ERD

<p align="center">
  <a href="docs/assets/database/UniAdmSys_ERD.png">
    <img src="docs/assets/database/UniAdmSys_ERD.png" alt="Database ERD" width="1400">
  </a>
</p>
'''
          p.write_text(s+block+"\n",encoding="utf-8")
          PY
          cd publish_repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/assets/database/UniAdmSys_ERD.png
          git add -u docs/database/ERD.md || true
          git diff --cached --quiet || git commit -m "docs: enlarge database ERD"
          git push origin main

      - name: Upload drawDB outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: UniAdmSys-drawDB-render
          path: |
            drawdb/render_out/**
            schema_drawdb.sql
          retention-days: 1
