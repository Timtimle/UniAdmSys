name: Temporary drawDB render

on:
  push:
    branches: [tmp-drawdb-render-20261004]
    paths:
      - "tmp_drawdb/**"
      - ".github/workflows/tmp-drawdb-render.yml"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Normalize SQL only for parser ordering
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path("tmp_drawdb/schema.sql")
          sql=p.read_text(encoding="utf-8")
          pat=re.compile(r"CREATE TABLE public\.(\w+)\s*\((.*?)\n\);",re.S)
          blocks=[]; fks=[]
          for m in pat.finditer(sql):
              name, body=m.group(1),m.group(2)
              kept=[]
              for ln in body.splitlines():
                  s=ln.strip().rstrip(",")
                  fm=re.match(r"CONSTRAINT\s+(\w+)\s+FOREIGN KEY\s*\(([^)]+)\)\s+REFERENCES\s+public\.(\w+)\(([^)]+)\)(.*)",s,re.I)
                  if fm:
                      cname,cols,rt,rcols,tail=fm.groups()
                      fks.append(f"ALTER TABLE public.{name} ADD CONSTRAINT {cname} FOREIGN KEY ({cols}) REFERENCES public.{rt}({rcols}){tail};")
                  else:
                      kept.append(ln)
              for i in range(len(kept)-1,-1,-1):
                  if kept[i].strip():
                      kept[i]=kept[i].rstrip().rstrip(",")
                      break
              blocks.append(f"CREATE TABLE public.{name} (\n"+"\n".join(kept)+"\n);")
          out="\n".join(blocks)+"\n\n"+"\n".join(fks)+"\n"
          out=out.replace("embedding USER-DEFINED","embedding vector")
          out=out.replace("GENERATED ALWAYS AS IDENTITY","GENERATED BY DEFAULT AS IDENTITY")
          Path("schema_drawdb.sql").write_text(out,encoding="utf-8")
          print("tables",len(blocks),"fks",len(fks))
          assert len(blocks)==27
          assert len(fks)==48
          PY

      - name: Checkout drawDB itself
        uses: actions/checkout@v4
        with:
          repository: drawdb-io/drawdb
          ref: ee550b4117a6e1b5366205faa5cee713ee1d4e3b
          path: drawdb

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install drawDB and browser automation
        working-directory: drawdb
        run: |
          npm ci
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Start drawDB
        working-directory: drawdb
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/drawdb.log 2>&1 &
          for i in {1..90}; do
            curl -fsS http://127.0.0.1:5173 >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/drawdb.log
          exit 1

      - name: Let drawDB import, auto-arrange and render
        run: |
          cp schema_drawdb.sql drawdb/schema_drawdb.sql
          cp tmp_drawdb/render.mjs drawdb/render.mjs
          cd drawdb
          node render.mjs

      - name: Upload drawDB outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: UniAdmSys-drawDB-render
          path: |
            drawdb/render_out/**
            schema_drawdb.sql
          retention-days: 1
