<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng Ký Tài Khoản Thí Sinh</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Tuyển Sinh Đại Học 2026</h1>
        <nav>
            <a href="index.html">Trang Chủ</a>
            <a href="login.html">Đăng Nhập</a>
        </nav>
    </header>

    <div class="container" style="max-width: 420px; margin-top: 40px;">
        <h2>Đăng Ký Tài Khoản Thí Sinh</h2>
        <form id="registerForm">
            <div class="form-group">
                <label>Họ và tên thí sinh:</label>
                <input type="text" id="regName" required placeholder="Nguyễn Văn A">
            </div>
            <div class="form-group">
                <label>Email thí sinh:</label>
                <input type="email" id="regEmail" required placeholder="nhapemail@gmail.com">
            </div>
            <div class="form-group">
                <label>Mật khẩu (ít nhất 6 ký tự):</label>
                <input type="password" id="regPassword" required placeholder="******">
            </div>
            <button type="submit" style="width: 100%; background-color: #28a745;">Đăng Ký</button>
        </form>

        <div style="margin-top: 20px; text-align: center; font-size: 14px;">
            Đã có tài khoản? <a href="login.html" style="color: #2a5298; font-weight: bold; text-decoration: none;">Đăng nhập ngay</a>
        </div>
    </div>

    <script>
        document.getElementById("registerForm").addEventListener("submit", function(e) {
            e.preventDefault();
            var name = document.getElementById("regName").value;
            var email = document.getElementById("regEmail").value;
            var pass = document.getElementById("regPassword").value;

            if (pass.length < 6) {
                alert("Mật khẩu phải từ 6 ký tự trở lên!");
                return;
            }

            alert("Đăng ký tài khoản thành công cho " + name + "!");
            window.location.href = "login.html";
        });
    </script>
</body>
</html>
